{{ partial "head.html" . }}
{{ partial "header.html" . }}

  <meta
     name="description"
     content="{{ if .Params.description }}{{ .Params.description }}{{ end }}"
   />

    <div class="container">
        <div class="row">
            <div class="sixteen columns">
                <article class="li-article">
                    <header class="li-article-header">
                        <h1 class="li-article-title">{{ .Title }}</h1>
                        <time class="li-article-date">
                          {{ $.Param "author" }}, Created: {{ .Date.Format "January 2, 2006" }}, Last update: {{ .Lastmod.Format "January 2, 2006" }}
                        </time>
                    </header>
                    <section>
                        {{ .Content }}
                    </section>
                </article>
            </div>
        </div>
    </div>
{{ partial "footer.html" . }}
{{ partial "tail.html" . }}
