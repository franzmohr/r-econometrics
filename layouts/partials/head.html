<!DOCTYPE html>
<html xmlns="//www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

        <title>{{ .Title }} &middot; {{ .Site.Title }}</title>
        {{ with $.Param "description" }}<meta name="description" content="{{ . }}" />{{ end }}
        {{ with $.Param "author" }}<meta name="author" content="{{ . }}" />{{ end }}
        <link rel="canonical" href="{{ .Permalink }}" />
        <link rel='stylesheet' href='//fonts.googleapis.com/css?family=Open+Sans:400,300,600' type='text/css'>
        <link rel="stylesheet" href="{{ "libraries/normalize.3.0.1.css" | relURL }}" />
        <link rel="stylesheet" href="{{ "css/liquorice.css" | relURL }}" />
        {{ range .AlternativeOutputFormats -}}
            {{ printf `<link rel="%s" type="%s" href="%s" title="%s" />` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
        {{ end -}}

        <!-- Google tag (gtag.js), configured via googleAnalytics in config.toml -->
        {{ template "_internal/google_analytics.html" . }}
    </head>
    <body class="li-body">
