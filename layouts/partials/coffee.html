{{/* Articles only: pages at the content root (about, links, *intro) have an empty .Section. */}}
{{ if .Section }}
<style>
  .coffee { text-align: center; padding: 32px 0 40px; }
  a.bmc-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 14px;
    border-radius: 6px;
    background-color: #ffdd00;
    color: #0d0c22;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(190, 190, 190, 0.5);
    transition: opacity 0.3s, box-shadow 0.3s;
  }
  a.bmc-button:hover, a.bmc-button:focus {
    color: #0d0c22;
    opacity: 0.85;
    box-shadow: 0 2px 4px rgba(190, 190, 190, 0.5);
  }
  a.bmc-button img { width: 22px; height: 22px; }
  a.bmc-button span { white-space: nowrap; }
</style>
<div class="container">
  <div class="row">
    <div class="sixteen columns coffee">
      <p>I hope this article was helpful. If you like, feel free to</p>
      <a class="bmc-button" target="_blank" rel="noopener" href="https://buymeacoffee.com/franzmohr">
        <img src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg" alt="">
        <span>support me with a coffee</span>
      </a>
    </div>
  </div>
</div>
{{ end }}
